domain_standards:
  applicable: false
  note: >-
    REWARD-ONLY CHECK, DELIBERATELY LEFT EMPTY. Azure Private Link is cloud network infrastructure. Its
    market has no interoperability data standard of the kind domain_standard_conformance rewards — there
    is no SCIM, OData, OpenRTB, FHIR, ISO 20022, LTI or OAI-PMH equivalent for private connectivity, and
    inventing one here to fill the slot would be fabrication. The genuine cross-vendor comparison in this
    space (AWS PrivateLink, Google Private Service Connect) is between three proprietary, mutually
    incompatible control planes. Checked against the networking sector entry in scoring.yml; nothing to
    probe.
  probed_candidates:
    - standard: OData
      result: not present — ARM is REST/JSON with no $metadata surface, no $filter or $select on this resource provider
    - standard: SCIM
      result: not applicable — no identity provisioning surface
