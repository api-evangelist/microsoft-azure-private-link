source: >-
  Registry metadata endpoints (registry.npmjs.org, pypi.org, api.nuget.org, search.maven.org,
  proxy.golang.org, rubygems.org) queried 2026-09-17, plus https://learn.microsoft.com/en-us/azure/developer/
note: >-
  Azure Private Link has no product-specific SDK. It is a resource type inside the Microsoft.Network
  resource provider, so the first-party clients are the Azure SDK network management libraries — each one
  generated by Microsoft from the same azure-rest-api-specs Swagger this repo harvests into
  openapi/_original/. The privateEndpoints, privateLinkServices, privateDnsZoneGroups and
  privateEndpointConnections operation groups are members of those packages. The Azure identity libraries
  are listed because every one of these operations is OAuth2-only and cannot be called without one.
