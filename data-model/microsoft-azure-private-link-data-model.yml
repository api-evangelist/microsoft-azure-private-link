description: >-
  The Private Link object graph, derived from the harvested Microsoft contract. It has two halves that
  meet at one join: the CONSUMER side (private endpoint) and the PRODUCER side (private link service).
  A PrivateEndpoint holds a PrivateLinkServiceConnection carrying the target's resource id; the producer
  sees the same relationship from the other end as a PrivateEndpointConnection. Both sides read and write
  the same PrivateLinkServiceConnectionState, which is why approval is a shared, two-party state machine
  rather than a field either party owns.
id_scheme:
  format: /subscriptions/{subscriptionId}/resourceGroups/{rg}/providers/Microsoft.Network/{type}/{name}
  note: >-
    Every entity is an ARM resource id. There are no opaque prefixed ids — the id IS the path, which means
    any resource id in a response can be used directly as a request path. The one non-ARM identifier is
    PrivateLinkService.properties.alias, an opaque provider-issued string a consumer uses to connect
    without being able to see the service.
