    operations: [PrivateDnsZoneGroups_CreateOrUpdate, PrivateDnsZoneGroups_Get, PrivateDnsZoneGroups_List, PrivateDnsZoneGroups_Delete]
    note: The binding that makes the PaaS hostname resolve to the endpoint's private IP. Without it the endpoint exists and nothing routes to it.
  - name: PrivateDnsZoneConfig
    kind: embedded
    properties: [name, privateDnsZoneId, recordSets]
  - name: RecordSet
    kind: embedded
    properties: [recordType, recordSetName, fqdn, provisioningState, ttl, ipAddresses]
    note: Read-only. The A records Azure wrote into the zone on your behalf.
  - name: PrivateEndpointIPConfiguration
    kind: embedded
    properties: [name, type, etag, groupId, memberName, privateIPAddress]
    note: Pins a specific private IP to a specific sub-resource member; the mechanism for static IP assignment.
  - name: CustomDnsConfigPropertiesFormat
    kind: embedded
    properties: [fqdn, ipAddresses]
    note: What to put in your own DNS if you are not using an Azure private DNS zone.
  - name: AvailablePrivateEndpointType
    kind: lookup
    properties: [name, id, type, resourceName, displayName]
    operations: [AvailablePrivateEndpointTypes_List, AvailablePrivateEndpointTypes_ListByResourceGroup]
    note: The catalogue of Azure resource types you can point a private endpoint at, per region.
  - name: PrivateLinkService
    kind: root resource
    side: producer
    key_properties: [id, name, type, location, tags, etag, extendedLocation]
    properties:
      - loadBalancerFrontendIpConfigurations
      - ipConfigurations
      - destinationIPAddress
      - accessMode
      - networkInterfaces
      - provisioningState
      - privateEndpointConnections
      - visibility
      - autoApproval
      - fqdns
      - alias
      - enableProxyProtocol
    operations: [PrivateLinkServices_CreateOrUpdate, PrivateLinkServices_Get, PrivateLinkServices_List, PrivateLinkServices_ListBySubscription, PrivateLinkServices_Delete]
    note: >-
      Sits in front of a Standard Load Balancer frontend. visibility and autoApproval are both ResourceSet
      subscription allow-lists — visibility says who may see the alias, autoApproval says whose connection
      is accepted without a human.
  - name: PrivateEndpointConnection
    kind: sub-resource
    side: producer
    key_properties: [id, name, type, etag]
    properties: [privateEndpoint, privateLinkServiceConnectionState, provisioningState, linkIdentifier, privateEndpointLocation]
    operations: [PrivateLinkServices_GetPrivateEndpointConnection, PrivateLinkServices_ListPrivateEndpointConnections, PrivateLinkServices_UpdatePrivateEndpointConnection, PrivateLinkServices_DeletePrivateEndpointConnection]
    note: The producer's view of one consumer's endpoint. Approving or rejecting happens here.
  - name: PrivateLinkServiceConnectionState
    kind: embedded
    properties: [status, description, actionsRequired]
    shared: true
    note: >-
      THE JOIN. The same three fields are written by the producer on PrivateEndpointConnection and read by
      the consumer on PrivateLinkServiceConnection. status is Pending / Approved / Rejected /
      Disconnected. This one object is the whole approval protocol.
