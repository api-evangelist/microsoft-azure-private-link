    note: >-
      Two collections of these hang off a private endpoint. privateLinkServiceConnections is the
      auto-approved path; manualPrivateLinkServiceConnections is the path that needs the producer to
      approve, and requestMessage is the note the consumer sends with the request.
  - name: PrivateDnsZoneGroup
