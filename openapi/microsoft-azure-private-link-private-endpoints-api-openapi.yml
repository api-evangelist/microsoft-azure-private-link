openapi: 3.2.0
info:
  title: NetworkManagementClient Private Endpoints API
  description: The Microsoft Azure Network management API provides a RESTful set of web services that interact with Microsoft Azure Networks service to manage your network resources. The API has entities that capture the relationship between an end user and the Microsoft Azure Networks service.
  version: '2025-03-01'
servers:
- url: https://management.azure.com
security:
- azure_auth:
  - user_impersonation
tags:
- name: Private Endpoints
paths:
  ? /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/privateEndpoints/{privateEndpointName}
  : delete:
      tags:
      - Private Endpoints
      operationId: PrivateEndpoints_Delete
      description: Deletes the specified private endpoint.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: privateEndpointName
        in: path
        required: true
        description: The name of the private endpoint.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '202':
          description: Accepted and the operation will complete asynchronously.
        '204':
          description: Delete successful.
        '200':
          description: Delete successful.
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: location
      summary: Private endpoints delete
      x-summary-source: derived
    get:
      tags:
      - Private Endpoints
      operationId: PrivateEndpoints_Get
      description: Gets the specified private endpoint by resource group.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: privateEndpointName
        in: path
        required: true
        description: The name of the private endpoint.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      - name: $expand
        in: query
        required: false
        description: Expands referenced resources.
        schema:
          type: string
      responses:
        '200':
          description: Request successful. The operation returns the resulting private endpoint resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpoint'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      summary: Private endpoints get
      x-summary-source: derived
    put:
      tags:
      - Private Endpoints
      operationId: PrivateEndpoints_CreateOrUpdate
      description: Creates or updates an private endpoint in the specified resource group.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - name: privateEndpointName
        in: path
        required: true
        description: The name of the private endpoint.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Update successful. The operation returns the resulting private endpoint resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpoint'
        '201':
          description: Create successful. The operation returns the resulting private endpoint resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpoint'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-long-running-operation: true
      x-ms-long-running-operation-options:
        final-state-via: azure-async-operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateEndpoint'
        description: Parameters supplied to the create or update private endpoint operation.
        required: true
      summary: Private endpoints create or update
      x-summary-source: derived
  /subscriptions/{subscriptionId}/resourceGroups/{resourceGroupName}/providers/Microsoft.Network/privateEndpoints:
    get:
      tags:
      - Private Endpoints
      operationId: PrivateEndpoints_List
      description: Gets all private endpoints in a resource group.
      parameters:
      - name: resourceGroupName
        in: path
        required: true
        description: The name of the resource group.
        schema:
          type: string
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Request successful. The operation returns a list of private endpoint resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointListResult'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Private endpoints list
      x-summary-source: derived
  /subscriptions/{subscriptionId}/providers/Microsoft.Network/privateEndpoints:
    get:
      tags:
      - Private Endpoints
      operationId: PrivateEndpoints_ListBySubscription
      description: Gets all private endpoints in a subscription.
      parameters:
      - $ref: '#/components/parameters/ApiVersionParameter'
      - $ref: '#/components/parameters/SubscriptionIdParameter'
      responses:
        '200':
          description: Request successful. The operation returns a list of private endpoint resources.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEndpointListResult'
        default:
          description: Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      x-ms-pageable:
        nextLinkName: nextLink
      summary: Private endpoints list by subscription
      x-summary-source: derived
components:
  schemas:
    SubResource:
      properties:
        id:
          type: string
          description: Resource ID.
      description: Reference to another subresource.
      x-ms-azure-resource: true
    ExtendedLocation:
      description: ExtendedLocation complex type.
      properties:
        name:
          type: string
          description: The name of the extended location.
        type:
          $ref: '#/components/schemas/ExtendedLocationType'
          description: The type of the extended location.
    CustomDnsConfigPropertiesFormat:
      properties:
        fqdn:
          type: string
          description: Fqdn that resolves to private endpoint ip address.
        ipAddresses:
          type: array
          items:
            type: string
          description: A list of private ip addresses of the private endpoint.
      description: Contains custom Dns resolution configuration from customer.
    PrivateEndpointIPConfigurationProperties:
      type: object
      properties:
        groupId:
          type: string
          description: The ID of a group obtained from the remote resource that this private endpoint should connect to.
        memberName:
          type: string
          description: The member name of a group obtained from the remote resource that this private endpoint should connect to.
        privateIPAddress:
          type: string
          description: A private ip address obtained from the private endpoint's subnet.
      description: Properties of an IP Configuration of the private endpoint.
    PrivateEndpointListResult:
      properties:
        value:
          type: array
          items:
            $ref: '#/components/schemas/PrivateEndpoint'
          description: A list of private endpoint resources in a resource group.
        nextLink:
          type: string
          description: The URL to get the next set of results.
          readOnly: true
      description: Response for the ListPrivateEndpoints API service call.
    PrivateEndpoint:
      properties:
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
          description: The extended location of the load balancer.
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/PrivateEndpointProperties'
          description: Properties of the private endpoint.
        etag:
          readOnly: true
          type: string
          description: A unique read-only string that changes whenever the resource is updated.
      allOf:
      - $ref: '#/components/schemas/Resource'
      description: Private endpoint resource.
    ProvisioningState:
      type: string
      readOnly: true
      description: The current provisioning state.
      enum:
      - Succeeded
      - Updating
      - Deleting
      - Failed
      x-ms-enum:
        name: ProvisioningState
        modelAsString: true
    ApplicationSecurityGroup:
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/ApplicationSecurityGroupPropertiesFormat'
          description: Properties of the application security group.
        etag:
          readOnly: true
          type: string
          description: A unique read-only string that changes whenever the resource is updated.
      allOf:
      - $ref: '#/components/schemas/Resource'
      description: An application security group in a resource group.
    PrivateLinkServiceConnectionState:
      properties:
        status:
          type: string
          description: Indicates whether the connection has been Approved/Rejected/Removed by the owner of the service.
        description:
          type: string
          description: The reason for approval/rejection of the connection.
        actionsRequired:
          type: string
          description: A message indicating if changes on the service provider require any updates on the consumer.
      description: A collection of information about the state of the connection between service consumer and provider.
    PrivateLinkServiceConnection:
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/PrivateLinkServiceConnectionProperties'
          description: Properties of the private link service connection.
        name:
          type: string
          description: The name of the resource that is unique within a resource group. This name can be used to access the resource.
        type:
          readOnly: true
          type: string
          description: The resource type.
        etag:
          readOnly: true
          type: string
          description: A unique read-only string that changes whenever the resource is updated.
      allOf:
      - $ref: '#/components/schemas/SubResource'
      description: PrivateLinkServiceConnection resource.
    PrivateEndpointIPConfiguration:
      type: object
      properties:
        properties:
          x-ms-client-flatten: true
          $ref: '#/components/schemas/PrivateEndpointIPConfigurationProperties'
          description: Properties of private endpoint IP configurations.
        name:
          type: string
          description: The name of the resource that is unique within a resource group.
        type:
          readOnly: true
          type: string
          description: The resource type.
        etag:
          readOnly: true
          type: string
          description: A unique read-only string that changes whenever the resource is updated.
      description: An IP Configuration of the private endpoint.
    PrivateEndpointProperties:
      properties:
        subnet:
          $ref: '#/components/schemas/Subnet'
          description: The ID of the subnet from which the private IP will be allocated.
        networkInterfaces:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/NetworkInterface'
          description: An array of references to the network interfaces created for this private endpoint.
        provisioningState:
          readOnly: true
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioning state of the private endpoint resource.
        ipVersionType:
          type: string
          description: Specifies the IP version type for the private IPs of the private endpoint. If not defined, this defaults to IPv4.
          enum:
          - IPv4
          - IPv6
          - DualStack
          default: IPv4
          x-ms-enum:
            name: PrivateEndpointIPVersionType
            modelAsString: true
            values:
            - name: IPv4
              value: IPv4
              description: Indicates that the Private IPs of the private endpoint will be IPv4 only.
            - name: IPv6
              value: IPv6
              description: Indicates that the Private IPs of the private endpoint will be IPv6 only.
            - name: DualStack
              value: DualStack
              description: Indicates that the Private IPs of the private endpoint can be both IPv4 and IPv6.
        privateLinkServiceConnections:
          type: array
          items:
            $ref: '#/components/schemas/PrivateLinkServiceConnection'
          description: A grouping of information about the connection to the remote resource.
        manualPrivateLinkServiceConnections:
          type: array
          items:
            $ref: '#/components/schemas/PrivateLinkServiceConnection'
          description: A grouping of information about the connection to the remote resource. Used when the network admin does not have access to approve connections to the remote resource.
        customDnsConfigs:
          type: array
          items:
            $ref: '#/components/schemas/CustomDnsConfigPropertiesFormat'
          description: An array of custom dns configurations.
        applicationSecurityGroups:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationSecurityGroup'
          description: Application security groups in which the private endpoint IP configuration is included.
        ipConfigurations:
          type: array
          items:
            $ref: '#/components/schemas/PrivateEndpointIPConfiguration'
          description: A list of IP configurations of the private endpoint. This will be used to map to the First Party Service's endpoints.
        customNetworkInterfaceName:
          type: string
          description: The custom name of the network interface attached to the private endpoint.
      description: Properties of the private endpoint.
    PrivateLinkServiceConnectionProperties:
      properties:
        provisioningState:
          readOnly: true
          $ref: '#/components/schemas/ProvisioningState'
          description: The provisioning state of the private link service connection resource.
        privateLinkServiceId:
          type: string
          description: The resource id of private link service.
        groupIds:
          type: array
          items:
            type: string
          description: The ID(s) of the group(s) obtained from the remote resource that this private endpoint should connect to.
        requestMessage:
          type: string
          description: A message passed to the owner of the remote resource with this connection request. Restricted to 140 chars.
        privateLinkServiceConnectionState:
          $ref: '#/components/schemas/PrivateLinkServiceConnectionState'
          description: A collection of read-only information about the state of the connection to the remote resource.
      description: Properties of the PrivateLinkServiceConnection.
    NetworkInterface:
      properties:
        extendedLocation:
          $ref: '#/components/schemas/ExtendedLocation'
          description: The extended location of the network interface.
        properties:
