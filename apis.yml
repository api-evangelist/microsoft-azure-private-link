description: >-
  Microsoft Azure Private Link gives a virtual network a private IP address onto an Azure PaaS service, a
  partner service, or a service the customer publishes themselves, so traffic reaches it across the
  Microsoft backbone and never traverses the public internet. It has two sides. A consumer creates a
  private endpoint pointing at a target resource id and attaches a private DNS zone group so the service's
  own hostname resolves to that private address. A producer publishes a private link service in front of a
  Standard Load Balancer, hands out an opaque alias, and approves or rejects the connections that arrive —
  including connections from other tenants. Both sides are managed through the Azure Resource Manager REST
  API at management.azure.com, which Microsoft publishes as Swagger 2.0 in its azure-rest-api-specs
  repository: 24 operations at api-version 2025-03-01, OAuth2 bearer only, with no API key and no
  anonymous surface.
