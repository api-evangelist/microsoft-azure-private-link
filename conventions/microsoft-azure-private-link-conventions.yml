description: >-
  Cross-cutting runtime semantics for the Azure Private Link control plane. Everything here is Azure
  Resource Manager platform behaviour — Private Link inherits it rather than defining its own — which is
  itself the useful fact for an integrator: learn ARM once and every Private Link operation follows.
